<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Challenge - Missing Number Series</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #333;
}

.card {
    background: white;
    width: 90%;
    max-width: 700px;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.instructions {
    margin: 15px 0;
}

button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    margin: 5px;
}

.primary {
    background: #2a5298;
    color: white;
}

.primary:hover {
    background: #1e3c72;
}

.option {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin: 6px 0;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #f0f4ff;
}

.selected {
    background: #d0e1ff;
    border-color: #2a5298;
}

.timer {
    font-weight: bold;
    text-align: right;
}

.hidden {
    display: none;
}

.result {
    text-align: center;
}
</style>
</head>

<body>

<div class="card">

<div id="landing">
    <h1>Quiz Challenge</h1>
    <div class="instructions">
        <ul>
            <li>One mark per question</li>
            <li>No negative marking</li>
            <li>Total time: 10 minutes</li>
            <li>20 Questions</li>
        </ul>
    </div>
    <button class="primary" onclick="startQuiz()">ENTER</button>
</div>

<div id="quiz" class="hidden">
    <div class="timer">Time Left: <span id="time">10:00</span></div>
    <h3 id="question"></h3>
    <div id="options"></div>
    <button onclick="prevQuestion()">Previous</button>
    <button class="primary" onclick="nextQuestion()">Next</button>
</div>

<div id="result" class="hidden result">
    <h2>Quiz Completed</h2>
    <h3 id="score"></h3>
    <button class="primary" onclick="restart()">Restart</button>
</div>

</div>

<script>

const questions = [
    {q:"2, 6, 12, 20, ?, 42", options:["28","30","32","34"], answer:0},
    {q:"5, 11, 19, 29, ?, 55", options:["39","41","43","45"], answer:1},
    {q:"3, 9, 27, ?, 243", options:["54","72","81","90"], answer:2},
    {q:"1, 4, 9, 16, ?, 36", options:["20","24","25","30"], answer:2},
    {q:"7, 14, 28, ?, 112", options:["42","56","63","70"], answer:1},
    {q:"4, 9, 19, 39, ?, 159", options:["69","79","89","99"], answer:1},
    {q:"10, 20, 40, 80, ?, 320", options:["140","150","160","170"], answer:2},
    {q:"8, 16, 24, ?, 40", options:["28","30","32","36"], answer:2},
    {q:"6, 13, 27, 55, ?, 223", options:["101","109","111","113"], answer:2},
    {q:"1, 8, 27, ?, 125", options:["48","54","64","72"], answer:2},
    {q:"9, 18, 36, ?, 144", options:["54","64","72","81"], answer:2},
    {q:"2, 5, 11, 23, ?, 95", options:["43","45","47","49"], answer:2},
    {q:"15, 30, 60, ?, 240", options:["100","110","120","130"], answer:2},
    {q:"1, 3, 6, 10, ?, 21", options:["12","14","15","18"], answer:2},
    {q:"5, 10, 20, 40, ?, 160", options:["60","70","80","90"], answer:2},
    {q:"3, 7, 15, 31, ?, 127", options:["55","59","61","63"], answer:3},
    {q:"4, 12, 36, ?, 324", options:["72","96","108","144"], answer:2},
    {q:"2, 4, 8, 16, ?, 64", options:["24","28","30","32"], answer:3},
    {q:"11, 22, 44, ?, 176", options:["66","77","88","99"], answer:2},
    {q:"3, 12, 48, ?, 768", options:["96","144","192","240"], answer:2}
];

let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);
let timer;
let timeLeft = 600;

function startQuiz(){
    document.getElementById("landing").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");
    showQuestion();
    startTimer();
}

function startTimer(){
    timer = setInterval(()=>{
        timeLeft--;
        let minutes = Math.floor(timeLeft/60);
        let seconds = timeLeft%60;
        document.getElementById("time").textContent =
            `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
        if(timeLeft<=0){
            clearInterval(timer);
            submitQuiz();
        }
    },1000);
}

function showQuestion(){
    let q = questions[currentQuestion];
    document.getElementById("question").textContent =
        `Question ${currentQuestion+1}: ${q.q}`;
    let optionsHTML = "";
    q.options.forEach((opt,i)=>{
        optionsHTML += `<div class="option ${answers[currentQuestion]===i?'selected':''}" 
        onclick="selectOption(${i})">${opt}</div>`;
    });
    document.getElementById("options").innerHTML = optionsHTML;
}

function selectOption(index){
    answers[currentQuestion] = index;
    showQuestion();
}

function nextQuestion(){
    if(currentQuestion < questions.length-1){
        currentQuestion++;
        showQuestion();
    } else {
        submitQuiz();
    }
}

function prevQuestion(){
    if(currentQuestion > 0){
        currentQuestion--;
        showQuestion();
    }
}

function submitQuiz(){
    clearInterval(timer);
    let score = 0;
    answers.forEach((ans,i)=>{
        if(ans === questions[i].answer) score++;
    });
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("score").textContent =
        `Your Score: ${score} / ${questions.length}`;
}

function restart(){
    location.reload();
}

</script>

</body>
</html>
